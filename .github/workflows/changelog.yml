# Adds every commit pushed to main, and every pull request merged into it, to CHANGELOG.md.
# A merged pull request is a push to main too, so one trigger covers both.
# The entry text comes from .github/scripts/update_changelog.py: the pull request's title, else the commit subject.
# Put [skip changelog] in a commit's subject, or on a line of its own in the message, to leave it out.
#
# The commit this workflow pushes uses GITHUB_TOKEN, and pushes made with that token do not start
# workflows, so it never triggers itself.
name: Update changelog

on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]
  workflow_dispatch:

# one run at a time; a queued run that gets replaced loses nothing, since each run starts from the
# newest commit CHANGELOG.md already records
concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add new commits to CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/update_changelog.py --before "$BEFORE" --after HEAD

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md [skip ci]"
          # main may have moved while this ran: rebase onto it and try again
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "could not push CHANGELOG.md after 3 attempts" >&2
          exit 1
