# A tag v<version> builds the .deb and the Windows installer and opens a DRAFT release with both attached.
# Publishing the draft is the maintainer's step. Builds start from a clean checkout: the package copies the
# harness files from the working tree, so nothing else may be in it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the version in package.json, pyproject.toml and packaging/harness/pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            const want = "v" + JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const fails = [];
            if (tag !== want) fails.push(`tag ${tag} is not ${want} (package.json)`);
            for (const f of ["pyproject.toml", "packaging/harness/pyproject.toml"]) {
              const m = /^version = "([^"]+)"/m.exec(fs.readFileSync(f, "utf8"));
              if (!m || "v" + m[1] !== tag) fails.push(`${f} has version ${m ? m[1] : "none"}`);
            }
            if (fails.length) { console.error(fails.join("\n")); process.exit(1); }
          '
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The packaged lock file is current
        run: uv lock --check --project packaging/harness
      - run: uv sync --group dev
      - run: uv run pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
            artifact: deb
            files: release/OpenZenBot_*_amd64.deb
          - os: windows-latest
            script: dist:win
            artifact: exe
            files: release/OpenZenBot-Setup-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --generate-notes --title "$TAG" installers/OpenZenBot_*_amd64.deb installers/OpenZenBot-Setup-*.exe
