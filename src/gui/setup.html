<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
  <title>OpenZenBot — Setting up</title>
  <style>
    :root{--canvas:#f5f5f5;--surface:#fff;--ink:#242424;--muted:#525252;--brand:#0f6cbd;--brand-hover:#115ea3;--border:#d1d1d1;--line:#e5e5e5;--success:#0e6027;--danger:#a4262c;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--radius:8px;--small-radius:4px;--font:'Segoe UI',system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:var(--s5) var(--s4);background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
    main{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s6) var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
    .brand{display:flex;align-items:center;gap:var(--s3);font-size:20px;font-weight:650;letter-spacing:-.3px}
    .brand img{width:40px;height:40px}
    h1{margin:0;font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.4px}
    p{margin:0;color:var(--muted)}
    ol{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2);font-size:14px}
    ol:empty,#line:empty,#detail-box[hidden],#actions:empty{display:none}
    li{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line)}
    li:last-child{border-bottom:0}
    li .label{color:var(--muted);white-space:nowrap}
    li.running{font-weight:600}li.running .label{color:var(--brand)}
    li.done .label{color:var(--success)}li.failed .label{color:var(--danger);font-weight:600}
    #line{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
    #detail-box h2{margin:0 0 var(--s2);font-size:14px;font-weight:600}
    pre{margin:0;max-height:240px;overflow:auto;padding:var(--s3);background:#f3f5f7;border:1px solid var(--line);border-radius:var(--small-radius);font:12px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    #actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
    button{font:inherit;font-size:14px;min-height:40px;padding:0 var(--s4);border-radius:var(--small-radius);border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
    button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
    button.primary:hover{background:var(--brand-hover)}
    button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
    button:disabled{opacity:.6;cursor:default}
  </style>
  <script defer src="./setup.js"></script>
</head>
<body>
  <main aria-live="polite">
    <div class="brand"><img src="./assets/zenbot-enso.svg" alt=""><span>OpenZenBot</span></div>
    <h1 id="heading">Opening OpenZenBot</h1>
    <p id="body"></p>
    <ol id="steps"></ol>
    <p id="line"></p>
    <div id="actions"></div>
    <section id="detail-box" hidden><h2 id="detail-title">Details</h2><pre id="detail"></pre></section>
  </main>
</body>
</html>
