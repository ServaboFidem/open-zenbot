# The installed app's Python environment: the root project's dependencies with
# CPU-only PyTorch (PyPI's Linux torch wheel pulls several GB of NVIDIA CUDA
# libraries). Keep `dependencies` equal to the root pyproject.toml's, plus torch
# (tests/test_packaged_deps.py checks this), then run `uv lock --project packaging/harness`.
[project]
name = "open-zenbot-harness"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.132",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "mcp>=2.3.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "reportlab>=5.1.0",
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
    "hindsight-all==1.2.0",
    "sentry-sdk>=2.74.0",
    "python-dotenv>=1.2",
    "langfuse==5.2.0",
    "ytmusicapi==1.12.3",
    "soco==0.32.2",
    "torch>=2.15.0",
    "pyatv==0.18.0",
    "pychromecast==14.1.1",
    "async-upnp-client==0.49.0",
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.32.0",
    "pillow>=13.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
