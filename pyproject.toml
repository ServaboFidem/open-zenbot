[project]
name = "Open-ZenBot"
version = "0.2.0"
description = "Open-source AI harness and personal assistant. Bring your own keys."
keywords = ["ai harness", "local ai", "personal assistant"]
authors = [
    {name = "Gordon Mott", email = "gordon.mott@gmail.com"}
]
maintainers = [
    {name = "Gordon Mott", email = "gordon.mott@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.132",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "mcp>=2.3.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "reportlab>=5.1.0",
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
    "hindsight-all==1.2.0",
    "sentry-sdk>=2.74.0",
    "python-dotenv>=1.2",
    "langfuse==5.2.0",
    "ytmusicapi==1.12.3",
    "soco==0.32.2",
    "pyatv==0.18.0",
    "pychromecast==14.1.1",
    "async-upnp-client==0.49.0",
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.32.0",
]

[project.urls]
Homepage = "https://zenandtheartofcode.com"
Documentation = "https://zenandtheartofcode.com/zenbot"
Repository = "https://github.com/ServaboFidem/open-zenbot.git"
"Bug Tracker" = "https://github.com/ServaboFidem/open-zenbot/issues"
Changelog = "https://github.com/ServaboFidem/open-zenbot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
